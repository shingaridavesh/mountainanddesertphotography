<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>National Parks | Mountain & Desert Photography</title>

<link rel="stylesheet" href="../assets/css/styles.css">

<style>

body{
    background:#080808;
    color:#f5f3ef;
    margin:0;
}

/* HERO */

.hero{
    height:50vh;
    background-image:url('../assets/images/national-parks/yosemite/yosemite-half-dome-fall-color.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.25),
        rgba(0,0,0,.70)
    );
}

.hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:2;
}

.hero h1{
    font-size:4rem;
    letter-spacing:2px;
    margin:0;
}

.hero p{
    margin-top:1rem;
    color:#d8c9aa;
}

.back-link{
    position:absolute;
    top:30px;
    left:30px;
    z-index:3;
    color:#d8c9aa;
    text-decoration:none;
}

/* INTRO */

.intro{
    padding:5rem 2rem;
}

.intro-inner{
    max-width:900px;
    margin:auto;
    text-align:center;
    line-height:2;
    color:#d8c9aa;
    font-size:1.5rem;
    font-style:italic;
    font-weight:300;
    letter-spacing:.3px;
}

/* GALLERY */

.gallery-grid{
    max-width:1600px;
    margin:auto;
    padding:2rem 3rem 6rem;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(500px,1fr));
    gap:4rem;
}

.gallery-card{
    background:none;
    border:none;
}

.gallery-card img{
    width:100%;
    display:block;
    object-fit:cover;
    transition:.35s ease;
}

.gallery-card:hover img{
    transform:scale(1.01);
}

.gallery-card-content{
    text-align:center;
    padding-top:1.25rem;
}

.gallery-card h3{
    margin:0;
    font-size:1.25rem;
    font-weight:400;
}

.gallery-card p{
    margin-top:.5rem;
    color:#b8996a;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:2.5rem;
}

.gallery-grid{
    grid-template-columns:1fr;
    padding:2rem 1.5rem 4rem;
}

}

</style>

</head>

<body>

<div class="hero">

<a href="../index.html" class="back-link">
← Back Home
</a>

<div class="hero-content">
<h1>National Parks</h1>
<p>America's Most Iconic Protected Landscapes</p>
</div>

</div>

<section class="intro">

<div class="intro-inner">

<p>
From the granite walls of Yosemite to the vast desert
canyons of the American Southwest, these photographs
celebrate the beauty, scale, and quiet moments found
within America's national parks.
</p>

</div>

</section>

<div id="gallery-grid" class="gallery-grid"></div>

<script>

fetch('../data/photos.json')
.then(response => response.json())
.then(photos => {

    const grid = document.getElementById('gallery-grid');

    photos
        .filter(photo => photo.gallery === 'national-parks')
        .forEach(photo => {

            const card = document.createElement('div');

            card.className = 'gallery-card';

            card.innerHTML = `
                <img src="${photo.image}" alt="${photo.title}">
                <div class="gallery-card-content">
                    <h3>${photo.title}</h3>
                    <p>${photo.location}</p>
                </div>
            `;

            grid.appendChild(card);
        });
});

</script>

</body>
</html>
