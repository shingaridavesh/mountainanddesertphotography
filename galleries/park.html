<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>National Park | Mountain & Desert Photography</title>

<link rel="stylesheet" href="../assets/css/styles.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#f5f3ef;
    font-family:Georgia, serif;
}

.hero{
    min-height:92vh;
    position:relative;
    background-size:cover;
    background-position:center;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:0 auto;
    padding:140px 40px 100px;
}

.hero-eyebrow{
    color:#c8a96b;
    letter-spacing:.35em;
    text-transform:uppercase;
    margin-top:80px;
    font-size:.7rem;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(4rem,8vw,7rem);
    font-weight:300;
    line-height:.95;
    margin:.5rem 0;
}

.hero p{
    max-width:650px;
    color:#ece6dc;
    line-height:1.9;
}

.hero h1{
    font-size:4rem;
    letter-spacing:.15em;
    margin:0;
}

.hero p{
    letter-spacing:.3em;
    color:#c7b178;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:80px 40px;
}

.description{
    max-width:900px;
    margin:auto;
    text-align:center;
    line-height:1.9;
    font-size:1.1rem;
}

.gallery{
    max-width:1500px;
    margin:auto;
    padding:0 3rem 8rem;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6rem;
}

.intro{
    padding:6rem 2rem 2rem;
}

.intro-inner{
    max-width:900px;
    margin:auto;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#ece6dc;
    line-height:1.7;
}

.divider{
    width:120px;
    height:1px;
    background:rgba(200,169,107,.4);
    margin:4rem auto;
}

.photo{
    overflow:hidden;
}

.photo img{
    width:100%;
    display:block;
    transition:transform .4s ease;
}

.photo:hover img{
    transform:scale(1.04);
}

.caption{
    padding:12px 0;
}

.caption h3{
    margin:0;
    font-size:.95rem;
    letter-spacing:.08em;
}

.caption p{
    margin-top:6px;
    color:#aaa;
    font-size:.85rem;
}

.back-link{
    text-align:center;
    padding:50px;
}

.back-link a{
    color:#c7b178;
    text-decoration:none;
    letter-spacing:.15em;
}

.park-subtitle{
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;
    font-weight:300;
    color:#c8a96b;
    letter-spacing:.15em;
}

.collection-intro{
    max-width:900px;
    margin:auto;
    text-align:center;
    padding:6rem 2rem 3rem;
}

.collection-intro h2{
    font-family:'Cormorant Garamond',serif;
    font-size:3rem;
    font-weight:300;
    color:#c8a96b;
    margin-bottom:2rem;
}

.collection-intro p{
    line-height:2;
    color:#ece6dc;
    font-size:1.1rem;
}

.story{
    max-width:850px;
    margin:auto;
    padding:0 2rem 5rem;
}

.story p{
    line-height:2.1;
    color:#b9b0a0;
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:95vw;
    max-height:95vh;
}

.lightbox-close{
    position:absolute;
    top:30px;
    right:40px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

</style>
</head>

<body>

<section class="hero" id="hero">

```
<div class="hero-content">

    <a href="national-parks.html" class="back-link">
        ← National Parks
    </a>

    <div class="hero-eyebrow">
        Fine Art Collection
    </div>

    <h1 id="parkTitle"></h1>

    <p id="collectionText"></p>

</div>
```

</section>

<section class="intro">

```
<div class="intro-inner" id="storyText"></div>

<div class="divider"></div>
```

</section>

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox">

```
<span class="lightbox-close">&times;</span>

<img id="lightbox-img">
```

</div>

<script src="../assets/js/parks.js"></script>

</body>

</html>
