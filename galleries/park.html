<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>National Park | Mountain & Desert Photography</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/styles.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#f5f3ef;
    font-family:Georgia, serif;
}

.hero{
    min-height:92vh;
    position:relative;
    background-size:cover;
    background-position:center;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:0 auto;
    padding:140px 40px 100px;
}

.hero-eyebrow{
    color:#c8a96b;
    letter-spacing:.35em;
    text-transform:uppercase;
    margin-top:80px;
    font-size:.7rem;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(4rem,8vw,7rem);
    font-weight:300;
    line-height:.95;
    margin:.5rem 0;
}

.park-subtitle{
    display:block;
    font-size:.45em;
    font-weight:300;
    margin-top:.2rem;
}

.hero p{
    max-width:650px;
    color:#ece6dc;
    line-height:1.9;
}

.hero h1{
    font-size:4rem;
    letter-spacing:.15em;
    margin:0;
}

.hero p{
    letter-spacing:.3em;
    color:#c7b178;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:80px 40px;
}

.description{
    max-width:900px;
    margin:auto;
    text-align:center;
    line-height:1.9;
    font-size:1.1rem;
}

.gallery{
    max-width:1500px;
    margin:auto;
    padding:0 3rem 8rem;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6rem;
}

.intro{
    padding:6rem 2rem 2rem;
}

.intro-inner{
    max-width:900px;
    margin:auto;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#ece6dc;
    line-height:1.7;
}

.divider{
    width:120px;
    height:1px;
    background:rgba(200,169,107,.4);
    margin:4rem auto;
}

.photo{
    overflow:hidden;
}

.photo img{
    width:100%;
    display:block;
    transition:transform .4s ease;
}

.photo:hover img{
    transform:scale(1.04);
}

.caption{
    text-align:center;
    padding-top:1.5rem;
}

.caption h3{
    font-family:'Cormorant Garamond',serif;
    font-size:1.7rem;
    font-weight:300;
    margin:0;
}

.caption p{
    color:#a29a8c;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:.7rem;
    margin-top:.75rem;
}

.back-link{
    text-align:center;
    padding:50px;
}

.back-link a{
    color:#c7b178;
    text-decoration:none;
    letter-spacing:.15em;
}

.park-subtitle{
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;
    font-weight:300;
    color:#c8a96b;
    letter-spacing:.15em;
}

.collection-intro{
    max-width:900px;
    margin:auto;
    text-align:center;
    padding:6rem 2rem 3rem;
}

.collection-intro h2{
    font-family:'Cormorant Garamond',serif;
    font-size:3rem;
    font-weight:300;
    color:#c8a96b;
    margin-bottom:2rem;
}

.collection-intro p{
    line-height:2;
    color:#ece6dc;
    font-size:1.1rem;
}

.story{
    max-width:850px;
    margin:auto;
    padding:0 2rem 5rem;
}

.story p{
    line-height:2.1;
    color:#b9b0a0;
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:80vw;
    max-height:80vh;
    object-fit:contain;
}

.lightbox-close{
    position:absolute;
    top:30px;
    right:40px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.lightbox-prev,
.lightbox-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:white;
    font-size:4rem;
    cursor:pointer;
    z-index:10000;
}

.lightbox-prev{
    left:30px;
}

.lightbox-next{
    right:30px;
}

.lightbox-counter{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    text-align:center;
    color:#c8a96b;
}

.lightbox-info{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;
    text-align:center;
}

.lightbox-title{
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#f5f3ef;
    margin-bottom:.5rem;
}

#lightbox-title{
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#f5f3ef;
    margin-bottom:.5rem;
}

.lightbox-counter{
    color:#c8a96b;
    letter-spacing:.25em;
    font-size:.8rem;
}

</style>
</head>

<body>

<section class="hero" id="hero">

    <div class="hero-content">

        <a href="national-parks.html" class="back-link">
            ← National Parks
        </a>

        <div class="hero-eyebrow">
            Fine Art Collection
        </div>

        <h1 id="parkTitle"></h1>

        <p id="collectionText"></p>

    </div>

</section>

<section class="intro">

    <div class="intro-inner" id="storyText"></div>

    <div class="divider"></div>

</section>

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox">

    <span class="lightbox-close">&times;</span>

    <button class="lightbox-prev">&#10094;</button>

    <img id="lightbox-img">

    <button class="lightbox-next">&#10095;</button>

    <div class="lightbox-info">

        <h3 id="lightbox-title"></h3>

        <div class="lightbox-counter">
            <span id="lightbox-count"></span>
        </div>

    </div>

</div>

<script src="../assets/js/parks.js"></script>

</body>

</html>
