<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link rel="stylesheet" href="../assets/css/styles.css">

<style>

    body{
    margin:0;
    background:#080808;
    color:#f5f3ef;
    font-family:Georgia, serif;
}

.hero{
    min-height:92vh;
    position:relative;
    background-size:cover;
    background-position:center;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:0 auto;
    padding:140px 40px 100px;
}

.hero-eyebrow{
    color:#c8a96b;
    letter-spacing:.35em;
    text-transform:uppercase;
    margin-top:80px;
    font-size:.7rem;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(4rem,8vw,7rem);
    font-weight:300;
    line-height:.95;
    margin:.5rem 0;
}

.park-subtitle{
    display:block;
    font-size:.45em;
    font-weight:300;
    margin-top:.2rem;
}

.hero p{
    max-width:650px;
    color:#ece6dc;
    line-height:1.9;
}

.hero h1{
    font-size:4rem;
    letter-spacing:.15em;
    margin:0;
}

.hero p{
    letter-spacing:.3em;
    color:#c7b178;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:80px 40px;
}

.description{
    max-width:900px;
    margin:auto;
    text-align:center;
    line-height:1.9;
    font-size:1.1rem;
}

.gallery{
    max-width:1500px;
    margin:auto;
    padding:0 3rem 8rem;

    columns:2;
    column-gap:4rem;
}

.intro{
    padding:6rem 2rem 2rem;
}

.intro-inner{
    max-width:900px;
    margin:auto;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#ece6dc;
    line-height:1.7;
}

.divider{
    width:120px;
    height:1px;
    background:rgba(200,169,107,.4);
    margin:4rem auto;
}

.photo{
    overflow:hidden;
    break-inside:avoid;
    margin-bottom:4rem;
}

.photo img{
    width:100%;
    display:block;
    transition:transform .4s ease;
}

.photo:hover img{
    transform:scale(1.04);
}

.caption{
    text-align:center;
    padding-top:1.5rem;
}

.caption h3{
    font-family:'Cormorant Garamond',serif;
    font-size:1.7rem;
    font-weight:300;
    margin:0;
}

.caption p{
    color:#a29a8c;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:.7rem;
    margin-top:.75rem;
}

.back-link{
    text-align:center;
    padding:50px;
}

.back-link a{
    color:#c7b178;
    text-decoration:none;
    letter-spacing:.15em;
}




.gallery-header{
    text-align:center;
    padding:5rem 2rem 3rem;
}

/* LIGHTBOX */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:80vw;
    max-height:80vh;
    object-fit:contain;
}

.lightbox-close{
    position:absolute;
    top:30px;
    right:40px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.lightbox-prev,
.lightbox-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:white;
    font-size:4rem;
    cursor:pointer;
    z-index:10000;
}

.lightbox-prev{
    left:30px;
}

.lightbox-next{
    right:30px;
}

.lightbox-info{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;
    text-align:center;
}

#lightbox-title{
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#f5f3ef;
    margin:0;
}

.lightbox-counter{
    position:absolute;
    top:30px;
    right:90px;
    color:#c8a96b;
    letter-spacing:.25em;
    font-size:.8rem;
    opacity:.8;
}

@media (max-width: 900px){

    .gallery{
        columns:1;
    }

}

</style>

</head>

<body>


<section class="hero" id="hero">

    <div class="hero-content">

        <a href="../index.html" class="back-link">
            ← Home
        </a>

        <div class="hero-eyebrow">
            Fine Art Collection
        </div>

        <h1 id="galleryTitle"></h1>

        <p id="galleryCollection"></p>

    </div>

</section>

<section class="intro">

    <div class="intro-inner"
         id="galleryStory">
    </div>

    <div class="divider"></div>

</section>

<div
    id="gallery"
    class="gallery">
</div>

<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">

    <span class="lightbox-close">&times;</span>

    <button class="lightbox-prev">&#10094;</button>

    <img id="lightbox-img">

    <button class="lightbox-next">&#10095;</button>

    <div class="lightbox-info">

        <h3 id="lightbox-title"></h3>

        <div class="lightbox-counter">
            <span id="lightbox-count"></span>
        </div>

    </div>

</div>

<script src="../assets/js/gallery.js"></script>

<script>

const galleryNames = {

    forest:
        "Ancient Forests",

    mountains:
        "Mountain Landscapes",

    desert:
        "Desert Landscapes",

    southwest:
        "American Southwest",

    waterfalls:
        "Waterfalls"

};

const params =
    new URLSearchParams(
        window.location.search
    );
    

const gallery =
    params.get("gallery");

const data =
    galleryData[gallery];

if(data){

    document.title =
        data.name;

    document.getElementById(
        "galleryTitle"
    ).textContent =
        data.name;

    document.getElementById(
        "galleryCollection"
    ).textContent =
        data.collection;

    document.getElementById(
        "galleryStory"
    ).textContent =
        data.story;

    document.getElementById(
        "hero"
    ).style.backgroundImage =
        `url('${data.hero}')`;
}

fetch("../data/photos.json")

.then(r => r.json())

.then(photos => {

    const matchingPhotos =
        photos.filter(
            photo =>
                photo.tags?.includes(
                    gallery
                )
        );

    let currentIndex = 0;

    const galleryContainer =
        document.getElementById(
            "gallery"
        );

    const lightbox =
        document.getElementById(
            "lightbox"
        );

    const lightboxImg =
        document.getElementById(
            "lightbox-img"
        );

    const lightboxTitle =
        document.getElementById(
            "lightbox-title"
        );

    const lightboxCount =
        document.getElementById(
            "lightbox-count"
        );

    function showImage(index){

        if(index < 0)
            index =
                matchingPhotos.length - 1;

        if(index >= matchingPhotos.length)
            index = 0;

        currentIndex = index;

        const photo =
            matchingPhotos[index];

        lightboxImg.src =
            photo.image;

        lightboxTitle.textContent =
            photo.title;

        lightboxCount.textContent =
            `${index + 1} / ${matchingPhotos.length}`;

        lightbox.style.display =
            "flex";
    }

    matchingPhotos.forEach(
        (photo,index) => {

        galleryContainer.insertAdjacentHTML(
            "beforeend",
            `
            <div class="photo">

                <img
                    src="${photo.image}"
                    alt="${photo.title}"
                    loading="lazy"
                    class="gallery-image">

                <div class="caption">

                    <h3>${photo.title}</h3>

                    <p>${photo.location || ""}</p>

                </div>

            </div>
            `
        );

    });

    document.addEventListener(
        "click",
        e => {

            if(
                e.target.classList.contains(
                    "gallery-image"
                )
            ){

                const images =
                    [...document.querySelectorAll(
                        ".gallery-image"
                    )];

                currentIndex =
                    images.indexOf(
                        e.target
                    );

                showImage(currentIndex);
            }

        }
    );

    document.querySelector(
        ".lightbox-close"
    ).onclick = () =>
        lightbox.style.display =
            "none";

    document.querySelector(
        ".lightbox-prev"
    ).onclick = () =>
        showImage(currentIndex - 1);

    document.querySelector(
        ".lightbox-next"
    ).onclick = () =>
        showImage(currentIndex + 1);

    document.addEventListener(
        "keydown",
        e => {

            if(
                lightbox.style.display !==
                "flex"
            ) return;

            if(e.key === "ArrowRight")
                showImage(currentIndex + 1);

            if(e.key === "ArrowLeft")
                showImage(currentIndex - 1);

            if(e.key === "Escape")
                lightbox.style.display =
                    "none";
        }
    );

});

</script>

</body>
</html>
