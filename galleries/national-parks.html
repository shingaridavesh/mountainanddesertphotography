
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>National Parks</title>
</head>
<body>
<h1>National Parks</h1>
<div id="gallery"></div>

<script>
fetch('../data/photos.json')
.then(r => r.json())
.then(photos => {
  const gallery = document.getElementById('gallery');

  photos
    .filter(p => p.gallery === 'national-parks')
    .forEach(photo => {
      gallery.innerHTML += `
        <div>
          <img src="${photo.image}" style="max-width:600px;width:100%">
          <h3>${photo.title}</h3>
          <p>${photo.location}</p>
        </div>
      `;
    });
});
</script>
</body>
</html>
