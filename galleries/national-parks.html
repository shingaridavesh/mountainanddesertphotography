<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>National Parks | Mountain & Desert Photography</title>

<link rel="stylesheet" href="../assets/css/styles.css">

<style>
body{
    background:#080808;
    color:#f5f3ef;
    margin:0;
}

.hero{
    height:70vh;
    background-image:url('../assets/images/national-parks/yosemite/yosemite-half-dome-fall-color.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.35),
        rgba(0,0,0,.65)
    );
}

.hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:2;
}

.hero h1{
    font-size:4rem;
    margin:0;
    color:white;
}

.hero p{
    color:#d8c9aa;
    font-size:1.1rem;
    margin-top:1rem;
}

.back-link{
    position:absolute;
    top:30px;
    left:30px;
    color:#d8c9aa;
    text-decoration:none;
    z-index:3;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:2rem;
    max-width:1400px;
    margin:auto;
    padding:4rem 2rem;
}

.gallery-card{
    background:#111;
    border:1px solid rgba(255,255,255,.08);
    overflow:hidden;
    transition:all .3s ease;
}

.gallery-card:hover{
    transform:translateY(-5px);
}

.gallery-card img{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
}

.gallery-card-content{
    padding:1rem;
}

.gallery-card h3{
    margin:0;
    color:#fff;
}

.gallery-card p{
    margin-top:.5rem;
    color:#b8996a;
}
</style>
</head>

<body>

<div class="hero">

<a href="../index.html" class="back-link">
← Back Home
</a>

<div class="hero-content">
    <h1>National Parks</h1>
    <p>America's most iconic protected landscapes</p>
</div>

</div>

<div id="gallery-grid" class="gallery-grid"></div>

<script>
fetch('../data/photos.json')
.then(response => response.json())
.then(photos => {

    const grid = document.getElementById('gallery-grid');

    photos
        .filter(photo => photo.gallery === 'national-parks')
        .forEach(photo => {

            const card = document.createElement('div');

            card.className = 'gallery-card';

            card.innerHTML = `
                <img src="${photo.image}" alt="${photo.title}">
                <div class="gallery-card-content">
                    <h3>${photo.title}</h3>
                    <p>${photo.location}</p>
                </div>
            `;

            grid.appendChild(card);
        });
});
</script>

</body>
</html>
