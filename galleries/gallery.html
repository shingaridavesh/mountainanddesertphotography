<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link rel="stylesheet" href="../assets/css/styles.css">

<style>

.gallery-header{
    text-align:center;
    padding:5rem 2rem 3rem;
}

.gallery-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(320px,1fr));
    gap:2rem;
    padding:0 2rem 4rem;
    max-width:1400px;
    margin:auto;
}

.gallery-card{
    text-decoration:none;
    color:inherit;
    cursor:pointer;
}

.gallery-card img{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    display:block;
    transition:transform .3s ease;
}

.gallery-card:hover img{
    transform:scale(1.02);
}

.gallery-card h3{
    margin:.8rem 0 0;
    text-align:center;
    font-size:.9rem;
    letter-spacing:.08em;
}


/* LIGHTBOX */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:80vw;
    max-height:80vh;
    object-fit:contain;
}

.lightbox-close{
    position:absolute;
    top:30px;
    right:40px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.lightbox-prev,
.lightbox-next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:white;
    font-size:4rem;
    cursor:pointer;
    z-index:10000;
}

.lightbox-prev{
    left:30px;
}

.lightbox-next{
    right:30px;
}

.lightbox-info{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;
    text-align:center;
}

#lightbox-title{
    font-family:'Cormorant Garamond',serif;
    font-size:2rem;
    font-weight:300;
    color:#f5f3ef;
    margin:0;
}

.lightbox-counter{
    position:absolute;
    top:30px;
    right:90px;
    color:#c8a96b;
    letter-spacing:.25em;
    font-size:.8rem;
    opacity:.8;
}

</style>

</head>

<body>

<nav class="site-nav">
    <a href="../index.html">Home</a>
</nav>

<section class="gallery-header">

    <h1 id="galleryTitle">
        Gallery
    </h1>

</section>

<div
    id="galleryGrid"
    class="gallery-grid">
</div>

<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">

    <span class="lightbox-close">&times;</span>

    <button class="lightbox-prev">&#10094;</button>

    <img id="lightbox-img">

    <button class="lightbox-next">&#10095;</button>

    <div class="lightbox-info">

        <h3 id="lightbox-title"></h3>

        <div class="lightbox-counter">
            <span id="lightbox-count"></span>
        </div>

    </div>

</div>

<script>

const galleryNames = {

    forest:
        "Ancient Forests",

    mountains:
        "Mountain Landscapes",

    desert:
        "Desert Landscapes",

    southwest:
        "American Southwest",

    waterfalls:
        "Waterfalls"

};

const params =
    new URLSearchParams(
        window.location.search
    );

const gallery =
    params.get("gallery");

document.title =
    galleryNames[gallery] ||
    "Gallery";

document.getElementById(
    "galleryTitle"
).textContent =
    galleryNames[gallery] ||
    "Gallery";

fetch("../data/photos.json")

.then(r => r.json())

.then(photos => {

    const matchingPhotos =
        photos.filter(
            photo =>
                photo.tags?.includes(
                    gallery
                )
        );

    let currentIndex = 0;

    const grid =
        document.getElementById(
            "galleryGrid"
        );

    const lightbox =
        document.getElementById(
            "lightbox"
        );

    const lightboxImg =
        document.getElementById(
            "lightbox-img"
        );

    const lightboxTitle =
        document.getElementById(
            "lightbox-title"
        );

    const lightboxCount =
        document.getElementById(
            "lightbox-count"
        );

    function showImage(index){

        if(index < 0)
            index =
                matchingPhotos.length - 1;

        if(index >= matchingPhotos.length)
            index = 0;

        currentIndex = index;

        const photo =
            matchingPhotos[index];

        lightboxImg.src =
            photo.image;

        lightboxTitle.textContent =
            photo.title;

        lightboxCount.textContent =
            `${index + 1} / ${matchingPhotos.length}`;

        lightbox.style.display =
            "flex";
    }

    matchingPhotos.forEach(
        (photo,index) => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "gallery-card";

        card.innerHTML = `
            <img
                src="${photo.image}"
                alt="${photo.alt}"
                loading="lazy"
            >

            <h3>
                ${photo.title}
            </h3>
        `;

        card.addEventListener(
            "click",
            () => showImage(index)
        );

        grid.appendChild(card);

    });

    document.querySelector(
        ".lightbox-close"
    ).onclick = () =>
        lightbox.style.display =
            "none";

    document.querySelector(
        ".lightbox-prev"
    ).onclick = () =>
        showImage(currentIndex - 1);

    document.querySelector(
        ".lightbox-next"
    ).onclick = () =>
        showImage(currentIndex + 1);

    document.addEventListener(
        "keydown",
        e => {

            if(
                lightbox.style.display !==
                "flex"
            ) return;

            if(e.key === "ArrowRight")
                showImage(currentIndex + 1);

            if(e.key === "ArrowLeft")
                showImage(currentIndex - 1);

            if(e.key === "Escape")
                lightbox.style.display =
                    "none";
        }
    );

});

</script>

</body>
</html>
